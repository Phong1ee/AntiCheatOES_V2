[project]
name = "backend"
version = "0.1.0"
description = "Online Examination System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pygame>=2.6.1",
    "mysql-connector-python>=9.6.0",
    "dotenv>=0.9.9",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "werkzeug>=3.1.8",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "openpyxl>=3.1.5",
    "redis[hiredis]>=8.1.0",
    "python-docx>=1.2.0",
    "pypdf>=6.15.0",
    "pika>=1.3.2",
    "boto3>=1.35.0",
]

[tool.pytest.ini_options]
# Tests import the application directly from the repository's src directory.
pythonpath = ["."]
