events {}

http {
    # Compose recreates API containers during isolated verification and deploys.
    # Re-resolve their Docker DNS names instead of retaining stale container IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Do not let a removed Compose endpoint stall failover to the healthy API.
    resolver_timeout 1s;

    upstream oes_api {
        zone oes_api 64k;
        server api-1:8000 resolve max_fails=2 fail_timeout=10s;
        server api-2:8000 resolve max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        location = /health/live {
            proxy_pass http://oes_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        location = /health/ready {
            proxy_pass http://oes_api;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        location /api/ {
            proxy_pass http://oes_api;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
